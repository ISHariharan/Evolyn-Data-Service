spring.application.name=Evolyn Data Service

# Every value below reads an environment variable first and falls back to the
# local-development value after the colon: ${ENV_VAR:local-default}.
# On Render you set the environment variables; on your laptop nothing changes.

# Render tells the app which port to listen on through PORT
server.port=${PORT:3002}

# ===============================
# PostgreSQL (Neon in production)
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/evolyn_db}
spring.datasource.username=${DB_USERNAME:evolyn_user}
spring.datasource.password=${DB_PASSWORD:db_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
# Small connection pool: free databases allow only a few connections
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Internal API key
# ===============================
# Evolyn-API must send this in the X-Internal-Key header. Leave it empty locally
# to skip the check; ALWAYS set it in production (see InternalKeyFilter).
evolyn.internal-api-key=${INTERNAL_API_KEY:}

# ===============================
# MongoDB (not used yet)
# ===============================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/evolyn_db}
